# ============================================
# ERPNext Docker Compose - 生产环境配置
# 德川/裕霖业务管理系统
# ============================================
# 使用方法:
#   cp env.example .env && vim .env  # 配置环境变量
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
# ============================================

services:
  # ==================== 数据库服务 ====================
  mariadb:
    image: mariadb:10.6
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-mariadb
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erpnext}
      MYSQL_USER: ${MYSQL_USER:-erpnext}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ==================== Redis 缓存服务 ====================
  redis-cache:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-redis-cache
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-cache-data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # ==================== Redis 队列服务 ====================
  redis-queue:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-redis-queue
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis-queue-data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==================== ERPNext Web 服务 ====================
  erpnext-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        FRAPPE_VERSION: ${FRAPPE_VERSION:-version-16}
        ERPNEXT_VERSION: ${ERPNEXT_VERSION:-version-15}
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-web
    restart: always
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        bench serve --port 8000
      "
    environment:
      - SITE_NAME=${SITE_NAME}
      - MYSQL_HOST=mariadb
      - MYSQL_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - WORKER_TIMEOUT=${WORKER_TIMEOUT:-120}
      # AI Agent 环境变量
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - WECHAT_CORP_ID=${WECHAT_CORP_ID:-}
      - WECHAT_CORP_SECRET=${WECHAT_CORP_SECRET:-}
      - WECHAT_AGENT_ID=${WECHAT_AGENT_ID:-}
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
      - assets-data:/home/frappe/frappe-bench/sites/assets
    networks:
      - erpnext-network
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ==================== Socket.IO 服务 ====================
  erpnext-socketio:
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-socketio
    restart: always
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      - SITE_NAME=${SITE_NAME}
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites:ro
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - redis-queue
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==================== Worker Short Queue ====================
  erpnext-worker-short:
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-worker-short
    restart: always
    command: bench worker --queue short
    environment:
      - SITE_NAME=${SITE_NAME}
      - MYSQL_HOST=mariadb
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - redis-queue
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==================== Worker Long Queue ====================
  erpnext-worker-long:
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-worker-long
    restart: always
    command: bench worker --queue long
    environment:
      - SITE_NAME=${SITE_NAME}
      - MYSQL_HOST=mariadb
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - redis-queue
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==================== Worker Default Queue ====================
  erpnext-worker-default:
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-worker-default
    restart: always
    command: bench worker --queue default
    environment:
      - SITE_NAME=${SITE_NAME}
      - MYSQL_HOST=mariadb
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - redis-queue
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ==================== Scheduler 定时任务 ====================
  erpnext-scheduler:
    image: ${COMPOSE_PROJECT_NAME:-erpnext}/erpnext:${ERPNEXT_VERSION:-version-15}
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-scheduler
    restart: always
    command: bench schedule
    environment:
      - SITE_NAME=${SITE_NAME}
      - MYSQL_HOST=mariadb
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - sites-data:/home/frappe/frappe-bench/sites
      - logs-data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - redis-queue
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erpnext}-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - sites-data:/var/www/sites:ro
      - assets-data:/var/www/assets:ro
      - logs-data:/var/log/frappe
    networks:
      - erpnext-network
    depends_on:
      - erpnext-web
      - erpnext-socketio
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# ==================== 数据卷定义 ====================
volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-/var/lib/erpnext}/mariadb
  redis-cache-data:
    driver: local
  redis-queue-data:
    driver: local
  sites-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-/var/lib/erpnext}/sites
  assets-data:
    driver: local
  logs-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_PATH:-/var/lib/erpnext}/logs

# ==================== 网络定义 ====================
networks:
  erpnext-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-erpnext}-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
